project:
  type: default
  title: "Predição de Recall a partir de Ocorrências de Garantia"
  output-dir: ../reports
  render:
    - 01-analise.qmd
    - 02-executivo.qmd
    - dashboard.qmd

lang: pt

execute:
  echo: true
  warning: false
  freeze: false

jupyter: python3

# O formato fica no cabeçalho de cada documento, e não aqui. O relatório é
# `html` e o painel é `dashboard`; declarado no nível do projeto, o formato se
# somaria ao de cada documento e o Quarto tentaria produzir as duas saídas para
# ambos, colidindo no mesmo arquivo de destino.
